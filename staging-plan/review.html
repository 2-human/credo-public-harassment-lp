<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Independent reviews · Staging fix plan</title>
<link rel="stylesheet" href="plan.css">
<style>
.rv{margin:0 0 26px}.rv h2{margin-bottom:6px}.rv .files{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.rv .files button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font:600 12.5px system-ui;cursor:pointer}
.rv .files button.on{background:#12141d;color:#fff;border-color:#12141d}
.md{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;overflow-x:auto}
.md table{font-size:12.5px}.md td,.md th{vertical-align:top}.md h1{font-size:20px}.md h2{font-size:16px;margin-top:18px}
</style>
</head>
<body>
<script src="plan-nav.js" data-page="review"></script>
<main>
  <h1>Independent reviews</h1>
  <p class="lede">High-risk backlog items get a second opinion from another AI (GPT or Gemini). The reviewer sees only the
  review packet: what changed, the evidence and the conclusions, not our conversation. Its findings and how each was settled are shown here.</p>
  <div id="list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
var REVIEWS = [
  { id: 'PBI-05', title: 'Sticky call bar never covers the form', files: [['Packet', 'review/PBI-05.md'], ['GPT-5.5 review', 'review/PBI-05.review-gpt.md'], ['Resolution', 'review/PBI-05.triage.md']] },
  { id: 'PBI-01', title: 'Clean the page code', files: [['Packet', 'review/PBI-01.md'], ['GPT-5.5 review', 'review/PBI-01.review-gpt.md'], ['Resolution', 'review/PBI-01.triage.md']] }
];
var list = document.getElementById('list');
REVIEWS.forEach(function (r) {
  var box = document.createElement('section'); box.className = 'rv';
  box.innerHTML = '<h2>' + r.id + ' · ' + r.title + '</h2><div class="files"></div><div class="md">Loading…</div>';
  list.appendChild(box);
  var md = box.querySelector('.md'), files = box.querySelector('.files');
  function show(i) {
    files.querySelectorAll('button').forEach(function (b, j) { b.classList.toggle('on', i === j); });
    fetch(r.files[i][1] + '?cb=' + Date.now()).then(function (x) { return x.text(); }).then(function (t) { md.innerHTML = marked.parse(t.replace(/^<!--.*?-->\s*/s, '')); });
  }
  r.files.forEach(function (f, i) { var b = document.createElement('button'); b.textContent = f[0]; b.onclick = function () { show(i); }; files.appendChild(b); });
  show(r.files.length - 1);
});
</script>
</body>
</html>
